{% extends "base.html" %}
{% set title = "Sign Up - URSM Flood GIS" %}

{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-slate-800 bg-slate-900/40 p-6">
  <h1 class="text-xl font-semibold">Create Account</h1>
  <p class="text-sm text-slate-400 mt-1">
    Standby UI only (will be connected to Supabase later).
  </p>

  <div class="mt-4 rounded-xl border border-amber-500/30 bg-amber-500/10 p-3 text-sm text-amber-200">
    Standby Mode: No account is created yet.
  </div>

  <form class="mt-5 space-y-3" method="post" action="#">
    <div>
      <label class="text-xs text-slate-400">Email</label>
      <input
        type="email"
        name="email"
        placeholder="you@example.com"
        class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-600"
      />
    </div>

    <div>
        <label class="text-xs text-slate-400">Password</label>
        <div class="relative mt-1">
            <input
                id="signupPassword"
                type="password"
                name="password"
                placeholder="At least 8 characters"
                class="w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 pr-10 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-600"
            />
            <button
                type="button"
                onclick="togglePassword('signupPassword', this)"
                class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-200"
                title="Show/Hide Password"
            >
                👁
            </button>
        </div>
    </div>



    <div>
        <label class="text-xs text-slate-400">Confirm Password</label>
        <div class="relative mt-1">
            <input
                id="signupConfirmPassword"
                type="password"
                name="confirm_password"
                placeholder="••••••••"
                class="w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 pr-10 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-600"
            />
            <button
                type="button"
                onclick="togglePassword('signupConfirmPassword', this)"
                class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-slate-200"
                title="Show/Hide Password"
            >
                👁
            </button>
        </div>
    </div>


    <button
      type="button"
      class="w-full rounded-xl bg-slate-100 px-3 py-2 font-semibold text-slate-900 hover:bg-white"
    >
      Sign Up (Standby)
    </button>
  </form>

  <div class="mt-4 text-sm text-slate-400">
    Already have an account?
    <a class="text-slate-100 underline hover:text-white" href="/login">Login</a>
  </div>

  <div class="mt-4 text-xs text-slate-500">
    Later: use Supabase Auth + email verification.
  </div>
</div>

<script>
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;

  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "🙈";
  } else {
    input.type = "password";
    btn.textContent = "👁";
  }
}
</script>


{% endblock %}
