{% extends "base.html" %}
{% set title = "History - URSM Flood GIS" %}
{% set active = "history" %}

{% block content %}
<div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
    <div>
      <h1 class="text-lg font-semibold">History</h1>
      <p class="text-sm text-slate-400">Past 24 Hours / 7 Days • Rainfall/Flood status + Sensor trends</p>
    </div>

    <div class="flex items-center gap-2">
      <button data-range="24h"
        class="rangeBtn text-xs px-3 py-2 rounded-lg border border-slate-700 hover:bg-slate-800">
        Past 24 Hours
      </button>
      <button data-range="7d"
        class="rangeBtn text-xs px-3 py-2 rounded-lg border border-slate-700 hover:bg-slate-800">
        Past 7 Days
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
    <div class="rounded-xl border border-slate-800 bg-slate-950/40 p-3">
      <div class="text-sm font-semibold">Rainfall (mm/hr)</div>
      <canvas id="histRainChart" class="mt-3"></canvas>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-950/40 p-3">
      <div class="text-sm font-semibold">Water Level (m)</div>
      <canvas id="histWlChart" class="mt-3"></canvas>
    </div>
  </div>

  <div class="rounded-xl border border-slate-800 bg-slate-950/40 p-3 mt-4">
    <div class="flex items-center justify-between">
      <div class="text-sm font-semibold">Status History</div>
      <div id="historyUpdated" class="text-xs text-slate-400">—</div>
    </div>
    <div id="statusTable" class="mt-3 overflow-auto"></div>
    <div class="mt-3 text-xs text-slate-500" id="historyNote"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
